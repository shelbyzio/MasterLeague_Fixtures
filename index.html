<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap');

        :root {
            --world-gold: #ddec0f;
            --world-navy: #0a192f;
            --dark-bg: #050b14;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #ffffff; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        
        .heading-font { font-family: 'Outfit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(212, 175, 55, 0.2); 
            transition: all 0.2s; 
        }
        .glass-panel:active { transform: scale(0.99); }
        
        .score-box { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 16px; 
            border: 1px solid #333; 
            background: #000; 
        }
        
        .group-header { 
            background: linear-gradient(90deg, rgba(212,175,55,0.15) 0%, transparent 100%); 
            border-left: 3px solid var(--world-gold); 
        }
        
        .team-link { color: #ffffff !important; text-decoration: none; transition: color 0.2s; }
        .team-link:hover { color: var(--world-gold) !important; text-decoration: underline; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: rgba(221, 236, 15, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(221, 236, 15, 0.6); }
    </style>
</head>
<body class="no-scrollbar pb-28">

    <!-- HEADER -->

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenErr) {
                        console.warn("Custom token sign-in failed, falling back to anonymous auth:", tokenErr);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;
                setupFirestoreSync();
            } catch (err) {
                console.error("Firebase Initialization Error:", err);
                // Fallback to local storage if firebase offline
                loadLocalDataFallback();
                renderMain();
                showToast("Offline Mode: Loaded local backup", "warning");
            }
        }

        function setupFirestoreSync() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournamentState');
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.dbState = docSnap.data();
                } else {
                    initDefaultTournamentState();
                }
                renderMain();
            }, (error) => {
                console.error("Firestore sync error:", error);
                loadLocalDataFallback();
                renderMain();
            });
        }

        async function saveCloudData() {
            if (!currentUser || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournamentState');
                await setDoc(docRef, window.dbState);
            } catch (err) {
                console.error("Error saving to cloud:", err);
                showToast("Failed to sync changes to cloud", "error");
            }
        }

        function loadLocalDataFallback() {
            const saved = localStorage.getItem('tournamentStateBackup');
            if (saved) {
                window.dbState = JSON.parse(saved);
            } else {
                initDefaultTournamentState();
            }
        }

        function initDefaultTournamentState() {
            window.dbState.groups = DEFAULT_GROUPS;
            window.dbState.rounds = DEFAULT_ROUNDS;
            window.dbState.teams = DEFAULT_PLAYER_NAMES.map((name, i) => {
                const groupIndex = Math.floor(i / 4);
                const group = window.dbState.groups[groupIndex] || "Z";
                return {
                    id: i + 1,
                    name: name,
                    group: group,
                    link: DEFAULT_TELEGRAM_LINKS[name] || ""
                };
            });
            generateDefaultFixtures();
            saveCloudData();
        }

        function generateDefaultFixtures() {
            window.dbState.matches = [];
            let mid = 1;
            window.dbState.groups.forEach(g => {
                const gt = window.dbState.teams.filter(t => t.group === g);
                if (gt.length >= 4) {
                    const pairings = [
                        {h:0, a:1, r:1}, {h:2, a:3, r:1}, 
                        {h:0, a:2, r:2}, {h:1, a:3, r:2}, 
                        {h:0, a:3, r:3}, {h:1, a:2, r:3}
                    ];
                    pairings.forEach(p => {
                        window.dbState.matches.push({
                            id: mid++,
                            group: g,
                            round: p.r,
                            home: gt[p.h].name,
                            away: gt[p.a].name,
                            hS: null,
                            aS: null,
                            status: 'pending'
                        });
                    });
                }
            });
        }

        window.saveData = function() {
            saveCloudData();
            localStorage.setItem('tournamentStateBackup', JSON.stringify(window.dbState));
        };

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.dbState, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `master_league_world_cup_cloud_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Tournament data exported successfully", "success");
        };

        window.importData = function(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed && parsed.teams && parsed.matches && parsed.groups) {
                            window.dbState = parsed;
                            window.saveData();
                            renderMain();
                            showToast("Tournament data imported & synced to cloud!", "success");
                        } else {
                            showToast("Invalid JSON schema structure", "error");
                        }
                    } catch (err) {
                        showToast("Failed to parse JSON file", "error");
                    }
                };
            }
        };

        window.calculateStandingsForGroup = function(groupName) {
            const groupTeams = window.dbState.teams.filter(t => t.group === groupName).map(t => ({
                ...t,
                m: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
            }));

            const teamMap = {};
            groupTeams.forEach(gt => teamMap[gt.name] = gt);

            window.dbState.matches.forEach(m => {
                if (m.group === groupName && m.hS !== null && m.aS !== null) {
                    const home = teamMap[m.home];
                    const away = teamMap[m.away];
                    if (home && away) {
                        home.m++;
                        away.m++;
                        home.gf += Number(m.hS);
                        home.ga += Number(m.aS);
                        away.gf += Number(m.aS);
                        away.ga += Number(m.hS);

                        if (Number(m.hS) > Number(m.aS)) {
                            home.w++; home.pts += 3;
                            away.l++;
                        } else if (Number(m.hS) < Number(m.aS)) {
                            away.w++; away.pts += 3;
                            home.l++;
                        } else {
                            home.d++; home.pts += 1;
                            away.d++; away.pts += 1;
                        }
                        home.gd = home.gf - home.ga;
                        away.gd = away.gf - away.ga;
                    }
                }
            });

            return groupTeams.sort((a, b) => 
                b.pts - a.pts || 
                b.gd - a.gd || 
                b.gf - a.gf || 
                a.name.localeCompare(b.name)
            );
        };

        window.getTotalStats = function() {
            let totalMatches = window.dbState.matches.length;
            let completedMatches = window.dbState.matches.filter(m => m.hS !== null && m.aS !== null).length;
            let pendingMatches = totalMatches - completedMatches;
            return { totalMatches, completedMatches, pendingMatches };
        };

        function renderMain() {
            const container = document.getElementById('app-container');
            const modeBtnText = document.getElementById('mode-btn-text');
            const headerSub = document.getElementById('header-subtitle');

            if (window.appViewMode === 'public') {
                modeBtnText.textContent = "Admin";
                headerSub.textContent = "Cloud Synced Live View";
                container.innerHTML = renderPublicView();
            } else {
                modeBtnText.textContent = "Public View";
                headerSub.textContent = "Admin Management Portal";
                container.innerHTML = renderAdminView();
            }
        }

        function renderPublicView() {
            const enabledRounds = window.dbState.rounds.filter(r => r.enabled);
            const activeRoundObj = window.dbState.rounds.find(r => r.id === window.publicActiveRound) || enabledRounds[0] || { id: 1, name: "Round 1" };
            
            const currentRoundMatches = window.dbState.matches.filter(m => m.round === activeRoundObj.id);

            let matchesHtml = '';
            let lastGroup = '';

            if (currentRoundMatches.length === 0) {
                matchesHtml = `<div class="glass-panel p-8 text-center rounded-2xl text-zinc-400">No matches found for this round.</div>`;
            } else {
                currentRoundMatches.forEach(m => {
                    let groupHeader = '';
                    if (m.group !== lastGroup) {
                        lastGroup = m.group;
                        groupHeader = `<div class="group-header py-2 px-4 mb-3 text-[10px] font-black text-[var(--world-gold)] uppercase italic">Group ${m.group}</div>`;
                    }

                    const homeTeamObj = window.dbState.teams.find(t => t.name === m.home);
                    const awayTeamObj = window.dbState.teams.find(t => t.name === m.away);
                    const homeLink = homeTeamObj && homeTeamObj.link ? homeTeamObj.link : '#';
                    const awayLink = awayTeamObj && awayTeamObj.link ? awayTeamObj.link : '#';

                    const hS = m.hS !== null ? m.hS : '-';
                    const aS = m.aS !== null ? m.aS : '-';

                    let hColor = '';
                    let aColor = '';
                    if (m.hS !== null && m.aS !== null) {
                        if (m.hS === m.aS) { hColor = 'text-yellow-400'; aColor = 'text-yellow-400'; }
                        else if (m.hS > m.aS) { hColor = 'text-green-500'; aColor = 'text-red-500'; }

                    matchesHtml += `${groupHeader}

                            <div class="flex-1 text-right pr-3 text-xs sm:text-sm font-bold truncate">

                                <div class="score-box ${hColor}">${hS}</div>
                                <span class="text-zinc-600 text-xs font-bold">:</span>
                                <div class="score-box ${aColor}">${aS}</div>
                            </div>
                            <div class="flex-1 text-left pl-3 text-xs sm:text-sm font-bold truncate">
                                ${awayLink !== '#' ? `<a href="${awayLink}" target="_blank" class="team-link">${m.away}</a>` : m.away}

                        </div>`;

            let roundsNavHtml = enabledRounds.map(r => {
                const isActive = r.id === activeRoundObj.id;
                return `<button onclick="setPublicRound(${r.id})" class="flex-1 py-3.5 rounded-xl text-xs font-black uppercase transition-all ${isActive ? 'bg-[var(--world-gold)] text-black shadow-lg' : 'bg-zinc-900 text-white hover:bg-zinc-800'}">${r.name}</button>`;
            }).join('');

            let standingsHtml = window.dbState.groups.map(g => {
                const groupStandings = calculateStandingsForGroup(g);
                if (groupStandings.length === 0) return '';

                let rows = groupStandings.map(t => {
                    const tLink = t.link ? t.link : '#';
                    return `<tr class="h-12 border-b border-white/5 hover:bg-white/5">
                        <td class="text-left py-2 pl-3">
                            <div class="font-bold text-xs">${tLink !== '#' ? `<a href="${tLink}" target="_blank" class="team-link">${t.name}</a>` : t.name}</div>

                        <td class="text-zinc-400 text-xs">${t.m}</td>
                        <td class="text-zinc-400 text-xs">${t.w}</td>
                        <td class="text-zinc-400 text-xs">${t.d}</td>
                        <td class="text-zinc-400 text-xs">${t.l}</td>
                        <td class="text-zinc-400 text-xs">${t.gf}</td>
                        <td class="text-zinc-400 text-xs">${t.ga}</td>
                        <td class="text-zinc-400 text-xs">${t.gd > 0 ? '+' + t.gd : t.gd}</td>
                        <td class="font-extrabold text-[var(--world-gold)] text-xs pr-3">${t.pts}</td>
                    </tr>`;
                }).join('');

                return `<div class="bg-black/40 rounded-3xl p-5 border border-[var(--world-gold)]/10 overflow-x-auto shadow-xl">
                    <div class="text-xs font-black text-[var(--world-gold)] mb-3 uppercase tracking-wider">GROUP ${g}</div>
                    <table class="w-full text-center min-w-[320px]">
                        <thead>
                            <tr class="text-zinc-500 text-[10px] uppercase font-bold border-b border-white/10">
                                <th class="text-left pb-2 pl-3">TEAM</th>
                                <th class="pb-2">M</th>
                                <th class="pb-2">W</th>
                                <th class="pb-2">D</th>
                                <th class="pb-2">L</th>
                                <th class="pb-2">GF</th>
                                <th class="pb-2">GA</th>
                                <th class="pb-2">GD</th>
                                <th class="pb-2 pr-3">PTS</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            }).join('');

            return `
                <div class="space-y-8 fade-in">
                    <div class="flex space-x-2 overflow-x-auto no-scrollbar">
                        ${roundsNavHtml}
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h2 class="text-xs font-black uppercase tracking-[0.2em] text-zinc-400 mb-4 px-1 italic flex items-center justify-between">
                                <span>Match Fixtures</span>
                                <span class="text-[var(--world-gold)]">${activeRoundObj.name}</span>
                            </h2>
                            <div id="fixture-container" class="space-y-2">${matchesHtml}</div>
                        </div>
                        <div class="pt-4">
                            <h2 class="text-xs font-black uppercase tracking-[0.2em] text-zinc-400 mb-4 px-1 italic">League Standings</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${standingsHtml}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.setPublicRound = function(roundId) {
            window.publicActiveRound = roundId;
            renderMain();
        };

        function renderAdminView() {
            if (!checkAdminAuth()) {
                return `<div>Session expired. Please log in again.</div>`;
            }

            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'matches', label: 'Matches', icon: 'fa-futbol' },
                { id: 'teams', label: 'Teams', icon: 'fa-users' },
                { id: 'groups', label: 'Groups', icon: 'fa-layer-group' },
                { id: 'fixtures', label: 'Fixtures', icon: 'fa-calendar-alt' },
                { id: 'rounds', label: 'Rounds', icon: 'fa-sync-alt' },

            else if (window.activeAdminTab === 'teams') tabContent = renderAdminTeamsTab();
            else if (window.activeAdminTab === 'groups') tabContent = renderAdminGroupsTab();
            else if (window.activeAdminTab === 'fixtures') tabContent = renderAdminFixturesTab();
            else if (window.activeAdminTab === 'rounds') tabContent = renderAdminRoundsTab();
            else if (window.activeAdminTab === 'telegram') tabContent = renderAdminTelegramTab();
            else if (window.activeAdminTab === 'backup') tabContent = renderAdminBackupTab();

                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>

                    <div class="bg-black/40 border border-[var(--world-gold)]/10 rounded-3xl p-6 shadow-2xl">

            window.activeAdminTab = tabId;
            renderMain();
        };

                            <div class="text-[10px] uppercase font-bold text-zinc-400 mb-1">Pending</div>

                            <div class="text-[10px] uppercase font-bold text-zinc-400 mb-1">Active Rounds</div>

                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminMatchesTab() {
            let filteredMatches = window.dbState.matches.filter(m => {
                if (window.adminMatchFilters.round !== 'all' && m.round !== Number(window.adminMatchFilters.round)) return false;
                if (window.adminMatchFilters.group !== 'all' && m.group !== window.adminMatchFilters.group) return false;
                if (window.adminMatchFilters.status !== 'all' && m.status !== window.adminMatchFilters.status) return false;
                if (window.adminMatchFilters.search && !m.home.toLowerCase().includes(window.adminMatchFilters.search.toLowerCase()) && !m.away.toLowerCase().includes(window.adminMatchFilters.search.toLowerCase())) return false;
                return true;
            });

            let roundOptions = window.dbState.rounds.map(r => `<option value="${r.id}" ${window.adminMatchFilters.round == r.id ? 'selected' : ''}>${r.name}</option>`).join('');
            let groupOptions = window.dbState.groups.map(g => `<option value="${g}" ${window.adminMatchFilters.group === g ? 'selected' : ''}>Group ${g}</option>`).join('');

            let matchesListHtml = filteredMatches.map(m => {
                const isCompleted = m.hS !== null && m.aS !== null;
                return `
                    <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 w-full sm:w-auto">
                            <span class="px-2.5 py-1 bg-black/60 border border-[var(--world-gold)]/20 rounded-lg text-[10px] font-bold text-[var(--world-gold)]">R${m.round} • G${m.group}</span>
                            <span class="text-xs text-zinc-400">Match #${m.id}</span>
                        </div>
                        <div class="flex items-center space-x-4 w-full sm:w-auto justify-center">
                            <span class="text-xs font-bold text-right flex-1 sm:w-36 truncate">${m.home}</span>
                            <div class="flex items-center space-x-1">
                                <input type="number" min="0" id="h-score-${m.id}" value="${m.hS !== null ? m.hS : ''}" placeholder="-" class="w-12 h-10 bg-black border border-zinc-700 text-center font-bold text-sm rounded-lg text-white focus:border-[var(--world-gold)] focus:outline-none">
                                <span class="text-zinc-500 font-bold">:</span>
                                <input type="number" min="0" id="a-score-${m.id}" value="${m.aS !== null ? m.aS : ''}" placeholder="-" class="w-12 h-10 bg-black border border-zinc-700 text-center font-bold text-sm rounded-lg text-white focus:border-[var(--world-gold)] focus:outline-none">
                            </div>
                            <span class="text-xs font-bold text-left flex-1 sm:w-36 truncate">${m.away}</span>
                        </div>
                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                            <button onclick="saveMatchScore(${m.id})" class="px-3.5 py-2 bg-[var(--world-gold)] text-black font-extrabold text-xs rounded-xl hover:opacity-90 transition-all shadow-sm">
                                Save
                            </button>
                            ${isCompleted ? `<button onclick="resetMatchScore(${m.id})" class="px-3 py-2 bg-zinc-800 text-zinc-300 hover:text-white font-bold text-xs rounded-xl hover:bg-zinc-700 transition-all">Reset</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 class="text-base font-black uppercase tracking-wider text-[var(--world-gold)] italic">Match Score Management</h3>
                            <p class="text-xs text-zinc-400">Scores sync to cloud instantly for all players.</p>
                        </div>
                        <button onclick="clearMatchFilters()" class="text-xs text-[var(--world-gold)] hover:underline flex items-center space-x-1">
                            <i class="fas fa-undo text-[10px]"></i>
                            <span>Clear Filters</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 bg-black/30 p-4 rounded-2xl border border-white/5">
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-zinc-400 mb-1">Filter Round</label>
                            <select onchange="updateMatchFilter('round', this.value)" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                                <option value="all">All Rounds</option>
                                ${roundOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-zinc-400 mb-1">Filter Group</label>
                            <select onchange="updateMatchFilter('group', this.value)" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                                <option value="all">All Groups</option>
                                ${groupOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-zinc-400 mb-1">Filter Status</label>
                            <select onchange="updateMatchFilter('status', this.value)" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                                <option value="all" ${window.adminMatchFilters.status === 'all' ? 'selected' : ''}>All Status</option>
                                <option value="pending" ${window.adminMatchFilters.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="completed" ${window.adminMatchFilters.status === 'completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-zinc-400 mb-1">Search Team</label>
                            <input type="text" oninput="updateMatchFilter('search', this.value)" value="${window.adminMatchFilters.search}" placeholder="Team name..." class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                        </div>
                    </div>
                    <div class="space-y-3">${matchesListHtml || '<div class="text-center py-8 text-zinc-500">No matches match your filter criteria.</div>'}</div>
                </div>
            `;
        }

        window.updateMatchFilter = function(key, val) {
            window.adminMatchFilters[key] = val;
            renderMain();
        };

        window.clearMatchFilters = function() {
            window.adminMatchFilters = { round: 'all', group: 'all', status: 'all', search: '' };
            renderMain();
        };

        window.saveMatchScore = function(matchId) {
            const hInput = document.getElementById(`h-score-${matchId}`);
            const aInput = document.getElementById(`a-score-${matchId}`);
            
            const hVal = hInput.value.trim();
            const aVal = aInput.value.trim();

            if (hVal === '' || aVal === '') {
                showToast("Please enter both home and away scores", "warning");
                return;
            }

            const hNum = Number(hVal);
            const aNum = Number(aVal);

            if (hNum < 0 || aNum < 0) {
                showToast("Scores cannot be negative numbers", "error");
                return;
            }

            const match = window.dbState.matches.find(m => m.id === matchId);
            if (match) {
                match.hS = hNum;
                match.aS = aNum;
                match.status = 'completed';
                window.saveData();
                renderMain();
                showToast(`Match #${matchId} score saved to cloud`, "success");
            }
        };

        window.resetMatchScore = function(matchId) {
            const match = window.dbState.matches.find(m => m.id === matchId);
            if (match) {
                match.hS = null;
                match.aS = null;
                match.status = 'pending';
                window.saveData();
                renderMain();
                showToast(`Match #${matchId} score reset`, "info");
            }
        };

        function renderAdminTeamsTab() {
            let teamsRows = window.dbState.teams.map((t, idx) => `
                <tr class="border-b border-white/5 hover:bg-white/5 h-14">
                    <td class="pl-4 font-bold text-xs text-zinc-400">#${idx + 1}</td>
                    <td class="font-bold text-xs">${t.name}</td>
                    <td><span class="px-2.5 py-1 bg-[var(--world-gold)]/10 border border-[var(--world-gold)]/30 text-[var(--world-gold)] rounded-lg text-xs font-extrabold">Group ${t.group}</span></td>
                    <td class="text-xs text-zinc-400 truncate max-w-[150px]">${t.link ? `<a href="${t.link}" target="_blank" class="text-[var(--world-gold)] hover:underline">${t.link}</a>` : 'No link'}</td>
                    <td class="text-right pr-4 space-x-2">
                        <button onclick="openEditTeamModal(${t.id})" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold">Edit</button>
                        <button onclick="confirmDeleteTeam(${t.id})" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white rounded-lg text-xs font-bold transition-all">Delete</button>
                    </td>

            `).join('');

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 class="text-base font-black uppercase tracking-wider text-[var(--world-gold)] italic">Team Management</h3>
                            <p class="text-xs text-zinc-400">Add, edit, or remove teams and assign them to groups</p>
                        </div>
                        <button onclick="openAddTeamModal()" class="px-4 py-2.5 bg-[var(--world-gold)] text-black font-extrabold text-xs rounded-xl hover:opacity-90 transition-all flex items-center space-x-2 shadow-md">
                            <i class="fas fa-plus"></i>
                            <span>Add New Team</span>
                        </button>
                    </div>
                    <div class="bg-black/30 rounded-2xl border border-white/5 overflow-hidden">

                            <thead>
                                <tr class="border-b border-white/10 text-[10px] uppercase font-bold text-zinc-500">
                                    <th class="pl-4 py-3">#</th>
                                    <th>Team Name</th>
                                    <th>Group</th>
                                    <th>Telegram Link</th>
                                    <th class="text-right pr-4">Actions</th>

                            </thead>
                            <tbody>${teamsRows}</tbody>
                        </table>
                    </div>
                </div>

        }

        window.openAddTeamModal = function() {
            let groupOpts = window.dbState.groups.map(g => `<option value="${g}">Group ${g}</option>`).join('');
            openCustomModal(
                "Add New Team",
                `
                <form onsubmit="handleSaveNewTeam(event)" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Team Name</label>
                        <input type="text" id="modal-team-name" required class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none" placeholder="e.g. Italy">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Group Assignment</label>
                        <select id="modal-team-group" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                            ${groupOpts}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Telegram Link (Optional)</label>
                        <input type="url" id="modal-team-link" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none" placeholder="https://t.me/username">
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 text-zinc-300 rounded-xl text-xs font-bold">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-[var(--world-gold)] text-black rounded-xl text-xs font-extrabold">Save Team</button>
                    </div>
                </form>
                `
            );
        };

        window.handleSaveNewTeam = function(e) {
            e.preventDefault();
            const name = document.getElementById('modal-team-name').value.trim();
            const group = document.getElementById('modal-team-group').value;
            const link = document.getElementById('modal-team-link').value.trim();

            if (window.dbState.teams.some(t => t.name.toLowerCase() === name.toLowerCase())) {
                showToast("A team with this name already exists", "error");
                return;
            }

            const newId = window.dbState.teams.length > 0 ? Math.max(...window.dbState.teams.map(t => t.id)) + 1 : 1;
            window.dbState.teams.push({ id: newId, name, group, link });
            window.saveData();
            closeModal();
            renderMain();
            showToast(`Team "${name}" added successfully`, "success");
        };

        window.openEditTeamModal = function(teamId) {
            const team = window.dbState.teams.find(t => t.id === teamId);
            if (!team) return;

            let groupOpts = window.dbState.groups.map(g => `<option value="${g}" ${team.group === g ? 'selected' : ''}>Group ${g}</option>`).join('');
            openCustomModal(
                `Edit Team: ${team.name}`,
                `
                <form onsubmit="handleUpdateTeam(event, ${team.id})" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Team Name</label>
                        <input type="text" id="modal-edit-team-name" value="${team.name}" required class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Group Assignment</label>
                        <select id="modal-edit-team-group" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">

                        </select>
                    </div>

            const link = document.getElementById('modal-edit-team-link').value.trim();

            const team = window.dbState.teams.find(t => t.id === teamId);
            if (team) {
                if (window.dbState.teams.some(t => t.id !== teamId && t.name.toLowerCase() === name.toLowerCase())) {
                    showToast("Another team with this name already exists", "error");
                    return;
                }
                const oldName = team.name;
                team.name = name;
                team.group = group;
                team.link = link;

                if (oldName !== name) {
                    window.dbState.matches.forEach(m => {
                        if (m.home === oldName) m.home = name;
                        if (m.away === oldName) m.away = name;
                    });

                window.saveData();
                closeModal();
                renderMain();
                showToast("Team updated successfully", "success");

                <div class="space-y-6">
                    <div>
                        <h3 class="text-base font-black uppercase tracking-wider text-[var(--world-gold)] italic">Telegram Link Management</h3>
                        <p class="text-xs text-zinc-400">Manage Telegram URLs linked to team names on the public standings page</p>
                    </div>
                    <div class="bg-black/30 rounded-2xl border border-white/5 overflow-hidden">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-white/10 text-[10px] uppercase font-bold text-zinc-500">
                                    <th class="pl-4 py-3">Team Name</th>
                                    <th>Group</th>
                                    <th>Telegram URL</th>
                                    <th class="text-right pr-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>${telegramRows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.openEditTelegramModal = function(teamId) {
            const team = window.dbState.teams.find(t => t.id === teamId);
            if (!team) return;

            openCustomModal(
                `Edit Telegram Link: ${team.name}`,
                `
                <form onsubmit="handleUpdateTelegram(event, ${team.id})" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-1">Telegram URL</label>
                        <input type="url" id="modal-telegram-url" value="${team.link || ''}" placeholder="https://t.me/username" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-[var(--world-gold)] focus:outline-none">
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 text-zinc-300 rounded-xl text-xs font-bold">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-[var(--world-gold)] text-black rounded-xl text-xs font-extrabold">Save Link</button>
                    </div>
                </form>
                `
            );
        };

        window.handleUpdateTelegram = function(e, teamId) {
            e.preventDefault();
            const link = document.getElementById('modal-telegram-url').value.trim();
            const team = window.dbState.teams.find(t => t.id === teamId);
            if (team) {
                team.link = link;
                window.saveData();
                closeModal();
                renderMain();
                showToast(`Telegram link for ${team.name} updated`, "success");
            }
        };

        function renderAdminBackupTab() {
            return `
                <div class="space-y-6">
                    <div>
                        <h3 class="text-base font-black uppercase tracking-wider text-[var(--world-gold)] italic">Backup, Restore & Reset</h3>
                        <p class="text-xs text-zinc-400">Download JSON tournament data backup or reset cloud database</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center text-center space-y-4">
                            <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fas fa-download"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm">Export Data</h4>
                                <p class="text-xs text-zinc-400 mt-1">Download all teams, matches, and groups as a JSON file.</p>
                            </div>
                            <button onclick="exportData()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-md">
                                Export JSON
                            </button>
                        </div>
                        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center text-center space-y-4">
                            <div class="w-12 h-12 bg-green-500/20 text-green-400 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fas fa-upload"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm">Import Data</h4>
                                <p class="text-xs text-zinc-400 mt-1">Restore tournament state and sync to cloud.</p>
                            </div>
                            <label class="w-full py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl text-xs font-bold transition-all cursor-pointer shadow-md inline-block">
                                Import JSON
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center text-center space-y-4">
                            <div class="w-12 h-12 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center text-xl">
                                <i class="fas fa-trash-alt"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm">Reset Tournament</h4>
                                <p class="text-xs text-zinc-400 mt-1">Wipe cloud state and restore factory defaults.</p>
                            </div>
                            <button onclick="resetTournamentData()" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition-all shadow-md">
                                Reset Default
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.openCustomModal = function(title, htmlContent) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-actions').innerHTML = '';
            document.getElementById('custom-modal-backdrop').classList.remove('hidden');
        };

        window.showConfirmModal = function(title, message, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = `<p class="text-sm text-zinc-300">${message}</p>`;
            document.getElementById('modal-actions').innerHTML = `
                <button onclick="closeModal()" class="px-4 py-2 bg-zinc-800 text-zinc-300 rounded-xl text-xs font-bold">Cancel</button>
                <button id="modal-confirm-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-extrabold shadow-md">Confirm</button>
            `;
            document.getElementById('custom-modal-backdrop').classList.remove('hidden');
            
            document.getElementById('modal-confirm-btn').onclick = () => {
                closeModal();
                onConfirm();
            };
        };

        window.closeModal = function() {
            document.getElementById('custom-modal-backdrop').classList.add('hidden');
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-zinc-900 border-[var(--world-gold)]/40 text-white';
            let icon = 'fa-check-circle text-[var(--world-gold)]';
            
            if (type === 'error') {
                bg = 'bg-red-950/90 border-red-500/40 text-red-200';
                icon = 'fa-exclamation-circle text-red-400';
            } else if (type === 'warning') {
                bg = 'bg-amber-950/90 border-amber-500/40 text-amber-200';
                icon = 'fa-exclamation-triangle text-amber-400';
            } else if (type === 'info') {
                bg = 'bg-blue-950/90 border-blue-500/40 text-blue-200';
                icon = 'fa-info-circle text-blue-400';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md transform transition-all translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `
                <i class="fas ${icon} text-base"></i>
                <span class="text-xs font-bold">${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.onload = function() {
            initFirebase();
        };
    </script>
</body>
</html>
