<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Cup Format</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap');

        :root {
            --world-gold: #ddec0f;
            --world-navy: #0a192f;
            --dark-bg: #050b14;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--dark-bg); color: #ffffff; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .heading-font { font-family: 'Outfit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .score-box { background: #000; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 900; font-size: 15px; border: 1px solid #333; }
        .score-win { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .score-loss { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }
        .score-draw { color: #eab308; border-color: rgba(234, 179, 8, 0.4); }
        .nav-btn.active { background: var(--world-gold); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .admin-score-input { width: 50px; height: 50px; background: #111; border: 1px solid #333; border-radius: 12px; text-align: center; font-weight: 900; color: #fff; font-size: 18px; }
        .admin-score-input:focus { border-color: var(--world-gold); outline: none; }
        .group-header { background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, transparent 100%); border-left: 3px solid var(--world-gold); }
    </style>
</head>
<body class="no-scrollbar pb-24">

<div id="loading-screen" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-zinc-800 border-t-[var(--world-gold)] rounded-full animate-spin mb-4"></div>
</div>

<div id="admin-modal" class="fixed inset-0 z-[60] bg-black/95 flex items-center justify-center p-6 hidden">
    <div class="w-full max-w-xs space-y-6 text-center">
        <h2 class="heading-font text-xl uppercase italic">Admin <span class="text-[var(--world-gold)]">Access</span></h2>
        <input type="password" id="adminPass" class="w-full bg-zinc-900 border border-white/10 rounded-2xl p-4 text-center tracking-[1em] outline-none focus:border-[var(--world-gold)]" placeholder="••••">
        <button onclick="handleLogin()" class="w-full bg-[var(--world-gold)] text-black p-4 rounded-2xl font-black uppercase text-xs">Login</button>
        <button onclick="toggleModal('admin-modal', false)" class="text-zinc-600 text-[10px] font-bold uppercase">Cancel</button>
    </div>
</div>

<header class="sticky top-0 z-40 bg-[var(--world-navy)]/90 backdrop-blur-lg border-b border-[var(--world-gold)]/20 px-6 py-5">
    <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <!-- Image Logo ထည့်ရန်နေရာ -->
            <div class="w-10 h-10 bg-transparent rounded-xl flex items-center justify-center shadow-lg overflow-hidden">
                <img src="YOUR_IMAGE_URL_HERE" alt="Logo" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\'fas fa-trophy text-black text-lg\'></i>'; this.parentElement.classList.add('bg-[var(--world-gold)]')">
            </div>
            <div>
                <h1 class="heading-font text-lg leading-none italic">Master League <span class="text-[var(--world-gold)]">| World Cup</span></h1>
            </div>
        </div>
        <div class="flex bg-black p-1 rounded-xl">
            <button onclick="switchTab('user-view')" id="nav-user" class="nav-btn active px-5 py-2.5 rounded-lg text-[10px] font-black uppercase">PUBLIC</button>
            <button onclick="checkAdminAuth()" id="nav-admin" class="nav-btn px-5 py-2.5 rounded-lg text-[10px] font-black uppercase text-zinc-500">ADMIN</button>
        </div>
    </div>
</header>

<main class="p-5 max-w-4xl mx-auto">
    <section id="user-view" class="tab-content active">
        <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-8">
            <button onclick="setRound(1)" id="round-1" class="flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-[var(--world-gold)] text-black">Round 1</button>
            <button onclick="setRound(2)" id="round-2" class="flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-zinc-900">Round 2</button>
            <button onclick="setRound(3)" id="round-3" class="flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-zinc-900">Round 3</button>
        </div>
        <div class="space-y-12">
            <div><h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-4 px-2 italic">Match Fixtures</h2><div id="fixture-container" class="space-y-4"></div></div>
            <div><h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-4 px-2 italic">League Standings</h2><div id="standings-container" class="space-y-8"></div></div>
        </div>
    </section>

    <section id="admin-panel" class="tab-content space-y-8">
        <div class="glass-panel rounded-[2rem] p-8 text-center border-[var(--world-gold)]/30">
            <h3 class="text-xs font-black uppercase text-[var(--world-gold)] mb-4 tracking-widest italic">Live Result Manager</h3>
            <button onclick="resetScores()" class="bg-black border border-[var(--world-gold)] text-[var(--world-gold)] px-6 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-[var(--world-gold)] hover:text-black transition-all">Reset All Results</button>
        </div>
        <div id="admin-matches" class="space-y-4"></div>
    </section>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjKfiJjJOXU5N18d9afXapEr1FKcAcC4Y",
        authDomain: "theoneproleague-1e9db.firebaseapp.com",
        projectId: "theoneproleague-1e9db",
        storageBucket: "theoneproleague-1e9db.firebasestorage.app",
        messagingSenderId: "134837094397",
        appId: "1:134837094397:web:13dd1939b96f5b32487b94",
        measurementId: "G-KJ9FR70GXG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const SCORES_DOC = doc(db, "leagueData", "scores_v2");

    const PLAYER_NAMES = ["Argentina", "Australia", "Austria", "Belgium", "Bosnia and Herzegovina", "Brazil", "Canada", "Cape Verde", "Colombia", "Croatia", "Curaçao", "Czechia", "DR Congo", "Ecuador", "Egypt", "England", "France", "Germany", "Ghana", "Haiti", "Iran", "Iraq", "Japan", "Jordan", "Mexico", "Morocco", "Netherlands", "New Zealand", "Norway", "Panama", "Paraguay", "Portugal", "Qatar", "Saudi Arabia", "Scotland", "Senegal", "South Africa", "South Korea", "Spain", "Sweden", "Switzerland", "Tunisia", "Türkiye", "United States", "Uruguay", "Uzbekistan", "Algeria", "Côte d'Ivoire"];
    
    const TELEGRAM_LINKS = {
        "Argentina": "https://t.me/mikeyjn", "Australia": "https://t.me/KhantX_7272", "Austria": "https://t.me/lord_voldemort101",
        "Belgium": "https://t.me/Yenaingli", "Bosnia and Herzegovina": "https://t.me/EUREKA011775", "Brazil": "https://t.me/ggman53343",
        "Canada": "https://t.me/Bhone3245", "Cape Verde": "https://t.me/trt109829", "Colombia": "https://t.me/iz_szlai",
        "Croatia": "https://t.me/Saad_waiyan", "Curaçao": "", "Czechia": "https://t.me/Mgzay8",
        "DR Congo": "https://t.me/LuNyo0", "Ecuador": "https://t.me/ZinMinKhant2007", "Egypt": "https://t.me/AungGiy11",
        "England": "https://t.me/goddeden", "France": "https://t.me/Hemaljr10", "Germany": "https://t.me/MESSi_10FC",
        "Ghana": "https://t.me/Xeon144", "Haiti": "https://t.me/HHA7779", "Iran": "https://t.me/Thuya12345678901",
        "Iraq": "https://t.me/Thawtar19949", "Japan": "https://t.me/LHA_goodluck", "Jordan": "https://t.me/NaingHtun1",
        "Mexico": "https://t.me/Ordinary_1211", "Morocco": "https://t.me/MgOo1990", "Netherlands": "https://t.me/AHira99",
        "New Zealand": "https://t.me/ikc8088", "Norway": "https://t.me/z09khun", "Panama": "",
        "Paraguay": "https://t.me/Wyn_Rooney", "Portugal": "https://t.me/Pyaephyowin250832229", "Qatar": "https://t.me/iluv_Nadi",
        "Saudi Arabia": "https://t.me/lokidemon99", "Scotland": "https://t.me/kokyaw876", "Senegal": "https://t.me/yinaung11",
        "South Africa": "https://t.me/zingyia", "South Korea": "https://t.me/Kaylarr1", "Spain": "https://t.me/KyawGyi798260",
        "Sweden": "https://t.me/Rain78", "Switzerland": "https://t.me/Myominsoe_555", "Tunisia": "https://t.me/Myo3135",
        "Türkiye": "https://t.me/Phyu1724", "United States": "https://t.me/ChanAung1178", "Uruguay": "https://t.me/Rashford01112009",
        "Uzbekistan": "https://t.me/paingzay24", "Algeria": "https://t.me/kaunghtetko354", "Côte d'Ivoire": "https://t.me/MainLyan"
    };

    const G_NAMES = "ABCDEFGHIJKL".split("");
    let state = { teams: [], matches: [], scores: {}, activeRound: 1, isAdmin: false };

    function renderTeamName(name) {
        const link = TELEGRAM_LINKS[name];
        if (link && link !== "") {
            return `<a href="${link}" target="_blank" class="hover:text-[var(--world-gold)] transition-colors cursor-pointer">${name}</a>`;
        }
        return name;
    }

    function initLeague() {
        state.teams = PLAYER_NAMES.map((name, i) => ({ id: i + 1, name: name, group: G_NAMES[Math.floor(i / 4)], p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
        state.matches = [];
        let mid = 1;
        G_NAMES.forEach(g => {
            const gt = state.teams.filter(t => t.group === g);
            const pairings = [{h:0, a:1, r:1}, {h:2, a:3, r:1}, {h:0, a:2, r:2}, {h:1, a:3, r:2}, {h:0, a:3, r:3}, {h:1, a:2, r:3}];
            pairings.forEach(p => { state.matches.push({ id: mid++, group: g, round: p.r, home: gt[p.h].id, away: gt[p.a].id }); });
        });
    }

    onAuthStateChanged(auth, user => {
        if (user) {
            onSnapshot(SCORES_DOC, snap => {
                state.scores = snap.exists() ? snap.data() : {};
                recalculate();
                document.getElementById('loading-screen').style.display = 'none';
            });
        } else { signInAnonymously(auth); }
    });

    function recalculate() {
        state.teams.forEach(t => { t.p = t.w = t.d = t.l = t.gf = t.ga = t.gd = t.pts = 0; });
        state.matches.forEach(m => {
            const res = state.scores[m.id];
            if (res && res.hS !== null && res.aS !== null) {
                const h = state.teams.find(t => t.id === m.home), a = state.teams.find(t => t.id === m.away);
                const hs = parseInt(res.hS), as = parseInt(res.aS);
                h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
                if (hs > as) { h.w++; h.pts += 3; a.l++; } else if (as > hs) { a.w++; a.pts += 3; h.l++; } else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
                h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
            }
        });
        render();
    }

    function render() {
        const getCls = (s1, s2) => (s1 === null || s2 === null) ? 'text-zinc-600' : (s1 > s2 ? 'score-win' : (s1 < s2 ? 'score-loss' : 'score-draw'));
        const rdMatches = state.matches.filter(m => m.round === state.activeRound);
        let lastG = "";
        
        document.getElementById('fixture-container').innerHTML = rdMatches.map(m => {
            let header = m.group !== lastG ? (lastG = m.group, `<div class="group-header py-2 px-4 mb-3 text-[10px] font-black text-[var(--world-gold)] uppercase italic">Group ${m.group}</div>`) : "";
            const h = state.teams.find(t => t.id === m.home), a = state.teams.find(t => t.id === m.away);
            const res = state.scores[m.id] || { hS: null, aS: null };
            return header + `<div class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-2"><div class="flex-1 text-right pr-4 text-[11px] font-bold truncate">${renderTeamName(h.name)}</div><div class="flex items-center space-x-2"><div class="score-box ${getCls(res.hS, res.aS)}">${res.hS ?? '-'}</div><div class="score-box ${getCls(res.aS, res.hS)}">${res.aS ?? '-'}</div></div><div class="flex-1 text-left pl-4 text-[11px] font-bold truncate">${renderTeamName(a.name)}</div></div>`;
        }).join('');

        document.getElementById('standings-container').innerHTML = G_NAMES.map(g => {
            const gt = state.teams.filter(t => t.group === g).sort((a, b) => b.pts - a.pts || b.gd - a.gd);
            return `<div class="bg-black/40 rounded-3xl p-5 border border-[var(--world-gold)]/10 overflow-x-auto"><div class="text-[10px] font-black text-[var(--world-gold)] mb-4">GROUP ${g}</div><table class="w-full min-w-[500px] text-[10px] text-center"><thead><tr class="text-zinc-500"><th class="text-left">TEAM</th><th>M</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody class="divide-y divide-white/5">${gt.map(t => `<tr class="h-10"> <td class="text-left font-bold">${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td><td class="font-bold text-[var(--world-gold)]">${t.pts}</td></tr>`).join('')}</tbody></table></div>`;
        }).join('');

        if (state.isAdmin) {
            document.getElementById('admin-matches').innerHTML = rdMatches.map(m => {
                const h = state.teams.find(t => t.id === m.home), a = state.teams.find(t => t.id === m.away);
                const res = state.scores[m.id] || { hS: '', aS: '' };
                return `<div class="bg-zinc-950 p-4 rounded-2xl flex items-center justify-between"><span class="text-[10px] w-1/3 truncate">${h.name}</span><div class="flex space-x-2"><input type="number" value="${res.hS ?? ''}" oninput="updateScore(${m.id}, this.value, 'home')" class="admin-score-input"><input type="number" value="${res.aS ?? ''}" oninput="updateScore(${m.id}, this.value, 'away')" class="admin-score-input"></div><span class="text-[10px] w-1/3 truncate text-right">${a.name}</span></div>`;
            }).join('');
        }
    }

    window.updateScore = async (id, val, side) => {
        if (!state.scores[id]) state.scores[id] = { hS: null, aS: null };
        state.scores[id][side === 'home' ? 'hS' : 'aS'] = val === "" ? null : parseInt(val);
        await setDoc(SCORES_DOC, state.scores, { merge: true });
    };

    window.resetScores = async () => {
        if (confirm("Are you sure you want to reset all results?")) {
            await setDoc(SCORES_DOC, {});
            state.scores = {};
            render();
        }
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        state.isAdmin = id === 'admin-panel';
        render();
    };

    window.setRound = (r) => { 
        state.activeRound = r; 
        document.querySelectorAll('[id^="round-"]').forEach(el => el.className = `flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all ${el.id === 'round-'+r ? 'bg-[var(--world-gold)] text-black' : 'bg-zinc-900'}`);
        render(); 
    };

    window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('hidden', !show);
    window.checkAdminAuth = () => state.isAdmin ? switchTab('admin-panel') : toggleModal('admin-modal', true);
    window.handleLogin = () => { if (document.getElementById('adminPass').value === "1234") { toggleModal('admin-modal', false); switchTab('admin-panel'); } };

    window.onload = initLeague;
</script>
</body>
</html>
