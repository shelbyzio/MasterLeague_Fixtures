<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master League | Complete World Cup Tournament System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');

        :root {
            --world-gold: #ddec0f;
            --world-gold-hover: #c4d40b;
            --world-navy: #0a192f;
            --dark-bg: #050b14;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(221, 236, 15, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #ffffff; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        .heading-font { font-family: 'Outfit', sans-serif; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel { 
            background: var(--panel-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow); 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .glass-panel:hover {
            border-color: rgba(221, 236, 15, 0.35);
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
        }

        .score-box { 
            width: 38px; 
            height: 38px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 15px; 
            border: 1px solid #1e293b; 
            background: #020617; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .score-box {
                width: 44px;
                height: 44px;
                font-size: 16px;
                border-radius: 12px;
            }
        }

        .score-input {
            width: 48px;
            height: 42px;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            color: var(--world-gold);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        @media (min-width: 640px) {
            .score-input {
                width: 52px;
                height: 44px;
                font-size: 18px;
                border-radius: 12px;
            }
        }
        .score-input:focus {
            border-color: var(--world-gold);
            box-shadow: 0 0 10px rgba(221, 236, 15, 0.3);
        }

        .group-header { 
            background: linear-gradient(90deg, rgba(221,236,15,0.12) 0%, rgba(221,236,15,0) 100%); 
            border-left: 4px solid var(--world-gold); 
        }

        .team-link { 
            color: #ffffff !important; 
            text-decoration: none; 
            transition: color 0.2s ease, opacity 0.2s ease; 
        }
        .team-link:hover { 
            color: var(--world-gold) !important; 
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBULCL5Oj4k6wC0If5SNDKU9Qy0HdaqVS8",
        authDomain: "masterleague-8ebbb.firebaseapp.com",
        projectId: "masterleague-8ebbb",
        storageBucket: "masterleague-8ebbb.firebasestorage.app",
        messagingSenderId: "81387077466",
        appId: "1:81387077466:web:7605cb7b6fdb6ba499bd63",
        measurementId: "G-2HZQXFJWJD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    function updateCloudBadge(status, message) {
        const badge = document.getElementById('cloud-status-badge');
        if (!badge) return;

        if (status === 'connected') {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-cloud text-emerald-400"></i> Cloud Live`;
        } else if (status === 'restricted') {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-exclamation-triangle text-rose-400"></i> Fallback (${message || 'Locked'})`;
        } else {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-circle-notch animate-spin text-[7px]"></i> Connecting...`;
        }
    }

    signInAnonymously(auth).catch(err => {
        console.warn("Firebase Auth Note:", err.message);
        updateCloudBadge('restricted', 'Auth Blocked');
    });

    onAuthStateChanged(auth, user => {
        currentUser = user;
    });

    window.CloudDataService = {
        saveResultToCloud: async (matchId, payload) => {
            const matchIdStr = String(matchId);
            let cloudSaved = false;
            let cloudErrorMsg = "";

            try {
                await setDoc(doc(db, "matchResults", matchIdStr), payload);
                cloudSaved = true;
                updateCloudBadge('connected');
            } catch (err) {
                console.error("Firestore Write Failed:", err);
                cloudErrorMsg = err.code || err.message;
                updateCloudBadge('restricted', 'Restricted');
            }
            return { cloudSaved, cloudErrorMsg };
        },

        deleteResultFromCloud: async (matchId) => {
            const matchIdStr = String(matchId);
            let cloudDeleted = false;
            try {
                await deleteDoc(doc(db, "matchResults", matchIdStr));
                cloudDeleted = true;
            } catch (err) {
                console.error("Firestore Delete Failed:", err);
            }
            return { cloudDeleted };
        },

        subscribeToCloud: (callback) => {
            let unsubscribeFS = () => {};
            try {
                unsubscribeFS = onSnapshot(collection(db, "matchResults"), (snapshot) => {
                    const liveResults = {};
                    snapshot.forEach(docSnap => {
                        liveResults[docSnap.id] = docSnap.data();
                    });
                    callback(liveResults);
                    updateCloudBadge('connected');
                }, (err) => {
                    console.warn("Firestore subscription restricted:", err.message);
                    updateCloudBadge('restricted', 'Denied');
                });
            } catch (err) {
                console.warn("Firestore listener error:", err.message);
                updateCloudBadge('restricted', 'Offline');
            }
            return unsubscribeFS;
        }
    };
</script>

    let activeTab = "public";
    let activePublicStage = "group";
    let activeGroupRound = 1;
    let isAdminUnlocked = false;

    function loadLocalResults() {
        try {
            const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
            matchResults = stored ? JSON.parse(stored) : {};
        } catch (e) {
            console.error("Error reading storage:", e);
            matchResults = {};
        }
    }

    function saveLocalResults() {
        try {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(matchResults));
        } catch (e) {
            console.error("Error writing storage:", e);
        }
    }

    function calculateStandings(teams, fixtures, resultsMap) {
        const standingsMap = {};
        teams.forEach(t => {
            standingsMap[t.name] = {
                id: t.id,
                name: t.name,
                group: t.group,
                link: t.link,
                m: 0, w: 0, d: 0, l: 0,
                gf: 0, ga: 0, gd: 0, pts: 0
            };
        });

        fixtures.forEach(fixture => {
            const result = resultsMap[fixture.id];
            if (result && result.status === "finished" && result.homeScore !== null && result.awayScore !== null) {
                const home = standingsMap[fixture.home];
                const away = standingsMap[fixture.away];

                if (home && away) {
                    const hS = Number(result.homeScore);
                    const aS = Number(result.awayScore);

                    home.m++; away.m++;
                    home.gf += hS; home.ga += aS;
                    away.gf += aS; away.ga += hS;

                    if (hS > aS) {
                        home.w++; home.pts += 3; away.l++;
                    } else if (hS < aS) {
                        away.w++; away.pts += 3; home.l++;
                    } else {
                        home.d++; away.d++; home.pts += 1; away.pts += 1;
                    }

                    home.gd = home.gf - home.ga;
                    away.gd = away.gf - away.ga;
                }
            }
        });

        const groupStandings = {};
        GROUPS.forEach(g => {
            const groupTeams = Object.values(standingsMap).filter(t => t.group === g);
            groupTeams.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd;
                return b.gf - a.gf;
            });
            groupStandings[g] = groupTeams;
        });

        return groupStandings;
    }

    function isGroupStageComplete(resultsMap) {
        for (let i = 1; i <= 72; i++) {
            const res = resultsMap[i];
            if (!res || res.status !== "finished") return false;
        }
        return true;
    }

    function calculateBestThirdTeamsLive(groupStandings) {
        const thirdTeams = [];
        GROUPS.forEach(g => {
            const teams = groupStandings[g];
            if (teams && teams.length >= 3) {
                thirdTeams.push({ ...teams[2] });
            }
        });

        thirdTeams.sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.gd !== a.gd) return b.gd - a.gd;
            return b.gf - a.gf;
        });

        return thirdTeams.map((t, idx) => ({
            ...t,
            rank: idx + 1,
            qualified: idx < 8
        }));
    }

    function getQualifiedTeamsData(resultsMap) {
        const groupStandings = calculateStandings(TEAMS, GROUP_FIXTURES, resultsMap);
        const winners = [];
        const runnersUp = [];
        GROUPS.forEach(g => {
            const list = groupStandings[g];
            if (list && list.length >= 2) {
                winners.push({ ...list[0], group: g, position: 1 });
                runnersUp.push({ ...list[1], group: g, position: 2 });
            }
        });

        const bestThirds = calculateBestThirdTeamsLive(groupStandings);
        const qualifiedThirds = bestThirds.filter(t => t.qualified);

        return {
            groupStandings,
            winners,
            runnersUp,
            bestThirds,
            qualifiedThirds,
            isComplete: isGroupStageComplete(resultsMap)
        };
    }

    function validateR32Teams(qualifiedTeamsList) {
        const errors = [];
        if (!Array.isArray(qualifiedTeamsList) || qualifiedTeamsList.length !== 32) {
            errors.push(`Expected exactly 32 qualified teams, got ${qualifiedTeamsList ? qualifiedTeamsList.length : 0}`);
        }
        const seenIds = new Set();
        const seenNames = new Set();
        (qualifiedTeamsList || []).forEach(t => {
            if (!t || !t.id) {
                errors.push("Team missing ID");
                return;
            }
            if (seenIds.has(t.id)) {
                errors.push(`Duplicate team ID detected: ${t.id} (${t.name})`);
            }
            if (seenNames.has(t.name)) {
                errors.push(`Duplicate team name detected: ${t.name}`);
            }
            seenIds.add(t.id);
            seenNames.add(t.name);
        });

        if (errors.length > 0) {
            console.error("R32 TEAM VALIDATION FAILED:", errors);
            return false;
        }
        return true;
    }

    function generateRoundOf32Fixtures(qualifiedData) {
        const { winners, runnersUp, qualifiedThirds } = qualifiedData;
        const usedTeamIds = new Set();
        const qualifiedTeams = [];

        // Helper to safely add unique teams
        const addTeam = (t) => {
            if (t && t.id && !usedTeamIds.has(t.id) && qualifiedTeams.length < 32) {
                usedTeamIds.add(t.id);
                qualifiedTeams.push(t);
            }
        };

        // Add 12 group winners
        winners.forEach(t => addTeam(t));
        // Add 12 group runners-up
        runnersUp.forEach(t => addTeam(t));
        // Add 8 qualified third-place teams
        qualifiedThirds.forEach(t => addTeam(t));

        // If we don't have 32 unique teams yet (e.g. group stage incomplete or edge cases), fill deterministically from TEAMS
        if (qualifiedTeams.length < 32) {
            TEAMS.forEach(t => {
                if (!usedTeamIds.has(t.id) && qualifiedTeams.length < 32) {
                    usedTeamIds.add(t.id);
                    qualifiedTeams.push({ ...t, m: 0, pts: 0 });
                }
            });
        }

        // Validate 32 unique teams
        validateR32Teams(qualifiedTeams);

        const matches = [];
        for (let i = 0; i < 16; i++) {
            const team1 = qualifiedTeams[i * 2] || { id: 0, name: `Team ${i*2 + 1}` };
            const team2 = qualifiedTeams[i * 2 + 1] || { id: 0, name: `Team ${i*2 + 2}` };

            matches.push({
                id: 73 + i,
                stage: "R32",
                matchNumber: i + 1,
                home: team1.name,
                homeId: team1.id,
                away: team2.name,
                awayId: team2.id,
                nextMatchId: 89 + Math.floor(i / 2)
            });
        }
        return matches;
    }

    function generateRoundOf16Fixtures(r32Results) {
        const matches = [];
        for (let i = 0; i < 8; i++) {
            const m1Id = 73 + (i * 2);
            const m2Id = 74 + (i * 2);
            
            const w1 = r32Results[m1Id]?.winnerName || `Winner R32 #${(i*2)+1}`;
            const w2 = r32Results[m2Id]?.winnerName || `Winner R32 #${(i*2)+2}`;

            matches.push({
                id: 89 + i,
                stage: "R16",
                matchNumber: i + 1,
                home: w1,
                away: w2,
                nextMatchId: 97 + Math.floor(i / 2)
            });
        }
        return matches;
    }

    function generateQuarterFinalsFixtures(r16Results) {
        const matches = [];
        for (let i = 0; i < 4; i++) {
            const m1Id = 89 + (i * 2);
            const m2Id = 90 + (i * 2);
            
            const w1 = r16Results[m1Id]?.winnerName || `Winner R16 #${(i*2)+1}`;
            const w2 = r16Results[m2Id]?.winnerName || `Winner R16 #${(i*2)+2}`;

            matches.push({
                id: 97 + i,
                stage: "QF",
                matchNumber: i + 1,
                home: w1,
                away: w2,
                nextMatchId: 101 + Math.floor(i / 2)
            });
        }
        return matches;
    }

    function generateSemiFinalsFixtures(qfResults) {
        const matches = [];
        for (let i = 0; i < 2; i++) {
            const m1Id = 97 + (i * 2);
            const m2Id = 98 + (i * 2);
            
            const w1 = qfResults[m1Id]?.winnerName || `Winner QF #${(i*2)+1}`;
            const w2 = qfResults[m2Id]?.winnerName || `Winner QF #${(i*2)+2}`;

            matches.push({
                id: 101 + i,
                stage: "SF",
                matchNumber: i + 1,
                home: w1,
                away: w2,
                nextMatchId: i === 0 ? 103 : 104
            });
        }
        return matches;
    }

    function generateThirdAndFinalFixtures(sfResults) {
        const sf1Res = sfResults[101];
        const sf2Res = sfResults[102];

        const w1 = sf1Res?.winnerName || "Winner SF #1";
        const w2 = sf2Res?.winnerName || "Winner SF #2";
        const l1 = sf1Res?.loserName || "Loser SF #1";
        const l2 = sf2Res?.loserName || "Loser SF #2";

        return [
            {
                id: 103,
                stage: "THIRD",
                matchNumber: 1,
                home: l1,
                away: l2,
                nextMatchId: null
            },
            {
                id: 104,
                stage: "FINAL",
                matchNumber: 1,
                home: w1,
                away: w2,
                nextMatchId: null
            }
        ];
    }

    function validateKnockoutFixtures(allFixtures) {
        const errors = [];
        if (!allFixtures.R32 || allFixtures.R32.length !== 16) errors.push("R32 must have exactly 16 matches");
        if (!allFixtures.R16 || allFixtures.R16.length !== 8) errors.push("R16 must have exactly 8 matches");
        if (!allFixtures.QF || allFixtures.QF.length !== 4) errors.push("QF must have exactly 4 matches");
        if (!allFixtures.SF || allFixtures.SF.length !== 2) errors.push("SF must have exactly 2 matches");
        if (!allFixtures.THIRD || allFixtures.THIRD.length !== 1) errors.push("Third place must have 1 match");
        if (!allFixtures.FINAL || allFixtures.FINAL.length !== 1) errors.push("Final must have 1 match");

        if (allFixtures.R32) {
            const r32Teams = new Set();
            allFixtures.R32.forEach(m => {
                if (m.home === m.away) errors.push(`R32 Match #${m.matchNumber} home and away are identical (${m.home})`);
                r32Teams.add(m.home);
                r32Teams.add(m.away);
            });
            if (r32Teams.size !== 32) {
                errors.push(`R32 matches contain duplicate teams! Unique count: ${r32Teams.size}/32`);
            }
        }

        if (errors.length > 0) {
            console.error("INVALID KNOCKOUT FIXTURE STRUCTURE:", errors);
        }
        return errors.length === 0;
    }

    function getAllTournamentFixtures(resultsMap) {
        const qData = getQualifiedTeamsData(resultsMap);
        const r32 = generateRoundOf32Fixtures(qData);
        
        const r32Res = {};
        r32.forEach(m => { if(resultsMap[m.id]) r32Res[m.id] = resultsMap[m.id]; });
        const r16 = generateRoundOf16Fixtures(r32Res);

        const r16Res = {};
        r16.forEach(m => { if(resultsMap[m.id]) r16Res[m.id] = resultsMap[m.id]; });
        const qf = generateQuarterFinalsFixtures(r16Res);

        const qfRes = {};
        qf.forEach(m => { if(resultsMap[m.id]) qfRes[m.id] = resultsMap[m.id]; });
        const sf = generateSemiFinalsFixtures(qfRes);

        const sfRes = {};
        sf.forEach(m => { if(resultsMap[m.id]) sfRes[m.id] = resultsMap[m.id]; });
        const finalsArr = generateThirdAndFinalFixtures(sfRes);

        const fixturesObj = {
            R32: r32,
            R16: r16,
            QF: qf,
            SF: sf,
            THIRD: [finalsArr[0]],
            FINAL: [finalsArr[1]]
        };

        validateKnockoutFixtures(fixturesObj);
        return fixturesObj;
    }

        const search = document.getElementById('admin-search').value.toLowerCase().trim();

        let fixturesList = [];
        if (stageFilter === "ALL" || stageFilter.startsWith("GROUP")) {
            const roundNum = stageFilter === "GROUP_R1" ? 1 : stageFilter === "GROUP_R2" ? 2 : stageFilter === "GROUP_R3" ? 3 : null;
            GROUP_FIXTURES.forEach(m => {
                if (roundNum && m.round !== roundNum) return;
                if (groupFilter !== "ALL" && m.group !== groupFilter) return;
                fixturesList.push(m);
            });

        const allKnockout = getAllTournamentFixtures(matchResults);
        ['R32', 'R16', 'QF', 'SF', 'THIRD', 'FINAL'].forEach(sKey => {
            if (stageFilter === "ALL" || stageFilter === sKey) {
                allKnockout[sKey].forEach(m => fixturesList.push(m));

        if (statusFilter !== "ALL") {
            fixturesList = fixturesList.filter(m => {
                const res = matchResults[m.id];
                const st = res && res.status === "finished" ? "finished" : "pending";
                return st === statusFilter;

                        <div class="flex flex-col items-center">
                            <span class="text-[9px] font-black uppercase text-zinc-500 mb-1">HOME</span>
                            <input type="number" min="0" id="score-h-${m.id}" value="${res.homeScore ?? ''}" class="score-input" placeholder="-">
                        </div>
                        <span class="text-zinc-600 font-bold text-lg mt-4">:</span>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] font-black uppercase text-zinc-500 mb-1">AWAY</span>
                            <input type="number" min="0" id="score-a-${m.id}" value="${res.awayScore ?? ''}" class="score-input" placeholder="-">
                        </div>
                    </div>
                    ${isKnockout ? `
                    <div class="flex items-center justify-center space-x-3 pt-2 border-t border-white/5 text-[10px]">
                        <div class="flex items-center gap-1">
                            <span>Pen H:</span>
                            <input type="number" min="0" id="pen-h-${m.id}" value="${res.homePenalties ?? ''}" class="w-11 h-8 bg-black border border-zinc-700 text-center rounded text-xs font-bold text-[var(--world-gold)]">
                        </div>
                        <div class="flex items-center gap-1">
                            <span>Pen A:</span>
                            <input type="number" min="0" id="pen-a-${m.id}" value="${res.awayPenalties ?? ''}" class="w-11 h-8 bg-black border border-zinc-700 text-center rounded text-xs font-bold text-[var(--world-gold)]">
                        </div>
                    </div>` : ''}
                </div>

                <div class="flex items-center justify-between pt-1">
                    <span class="px-2.5 py-1 rounded-lg font-bold uppercase text-[9px] ${isFinished ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                        ${res.status.toUpperCase()}
                    </span>
                    <div class="flex space-x-2">
                        ${isFinished ? `<button onclick="clearMatchResult(${m.id})" class="px-3 py-2 rounded-xl text-xs font-bold bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 transition">Reset</button>` : ''}
                        <button onclick="saveMatchResult(${m.id}, '${m.home}', '${m.away}', ${isKnockout})" class="px-4 py-2 rounded-xl text-xs font-black uppercase bg-[var(--world-gold)] text-black hover:bg-[var(--world-gold-hover)] shadow-md transition">Save</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function handleLogin() {
        const pass = document.getElementById('admin-passcode').value.trim();
        if (pass === "2024") {
            isAdminUnlocked = true;
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('admin-panel-content').classList.remove('hidden');
            renderAdminMatches();
            showToast("Admin portal unlocked successfully!");
        } else {
            showToast("Password မှားယွင်းနေပါသည်။", true);
        }
    }

    async function saveMatchResult(matchId, homeTeam, awayTeam, isKnockout) {
        const hInput = document.getElementById(`score-h-${matchId}`).value;
        const aInput = document.getElementById(`score-a-${matchId}`).value;

        if (hInput === "" || aInput === "") {
            showToast("Please enter both home & away scores.", true);
            return;
        }

        const hScore = Number(hInput);
        const aScore = Number(aInput);

        if (homeTeam === awayTeam) {
            showToast("A team cannot play against itself!", true);
            return;
        }

        let winner = null;
        let loser = null;
        let winnerName = null;
        let loserName = null;
        let hPen = null;
        let aPen = null;

        if (hScore > aScore) {
            winner = 'home'; loser = 'away';
            winnerName = homeTeam; loserName = awayTeam;
        } else if (aScore > hScore) {
            winner = 'away'; loser = 'home';
            winnerName = awayTeam; loserName = homeTeam;
        } else {
            if (isKnockout) {
                const penHInput = document.getElementById(`pen-h-${matchId}`)?.value;
                const penAInput = document.getElementById(`pen-a-${matchId}`)?.value;
                if (penHInput === "" || penAInput === "" || penHInput === penAInput) {
                    showToast("Scores are tied! Penalty shootout winners required.", true);
                    return;
                }
                hPen = Number(penHInput);
                aPen = Number(penAInput);
                if (hPen > aPen) {
                    winner = 'home'; loser = 'away';
                    winnerName = homeTeam; loserName = awayTeam;
                } else {
                    winner = 'away'; loser = 'home';
                    winnerName = awayTeam; loserName = homeTeam;
                }
            } else {
                winner = 'draw';
            }
        }

        const payload = {
            matchId: Number(matchId),
            homeScore: hScore,
            awayScore: aScore,
            homePenalties: hPen,
            awayPenalties: aPen,
            winner,
            loser,
            winnerName,
            loserName,
            status: "finished",
            updatedAt: new Date().toISOString()
        };

        matchResults[matchId] = payload;
        saveLocalResults();

        if (window.CloudDataService) {
            await window.CloudDataService.saveResultToCloud(matchId, payload);
        }

        showToast(`Match #${matchId} result saved successfully!`);
        renderAdminMatches();
        renderPublicView();
    }

    async function clearMatchResult(matchId) {
        delete matchResults[matchId];
        saveLocalResults();
        if (window.CloudDataService) {
            await window.CloudDataService.deleteResultFromCloud(matchId);
        }
        showToast(`Match #${matchId} reset.`);
        renderAdminMatches();
        renderPublicView();
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        if (!toast) return;

        toastMsg.innerText = msg;
        toastIcon.className = isError ? "fas fa-exclamation-triangle text-rose-500 text-lg shrink-0" : "fas fa-check-circle text-[var(--world-gold)] text-lg shrink-0";
        toast.style.borderColor = isError ? "#f43f5e" : "#ddec0f";

        toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }

    window.onload = () => {
        loadLocalResults();

        const pubGroupSelect = document.getElementById('pub-group-select');
        const adminGroupSelect = document.getElementById('admin-group-select');
        if (pubGroupSelect && adminGroupSelect) {
            GROUPS.forEach(g => {
                const opt1 = document.createElement('option');
                opt1.value = g; opt1.innerText = `Group ${g}`;
                pubGroupSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = g; opt2.innerText = `Group ${g}`;
                adminGroupSelect.appendChild(opt2);
            });
        }

        if (window.CloudDataService) {
            window.CloudDataService.subscribeToCloud(liveResults => {
                matchResults = { ...matchResults, ...liveResults };
                saveLocalResults();
                if (activeTab === 'public') renderPublicView();
                else if (isAdminUnlocked) renderAdminMatches();
            });
        }

        renderPublicView();
    };
</script>
</body>
</html>
