<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Cup Format</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap');

        :root {
            --world-gold: #ddec0f;
            --world-navy: #0a192f;
            --dark-bg: #050b14;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--dark-bg); color: #ffffff; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .heading-font { font-family: 'Outfit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); transition: all 0.2s; }
        .glass-panel:active { transform: scale(0.98); background: rgba(212, 175, 55, 0.1); }
        .score-box { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 900; font-size: 16px; border: 1px solid #333; background: #000; }
        .group-header { background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, transparent 100%); border-left: 3px solid var(--world-gold); }
        .team-link { color: #ffffff !important; text-decoration: none; }
        .team-link:hover { color: var(--world-gold) !important; text-decoration: underline; }

        /* Smooth fade-in transition for round tab switching */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="no-scrollbar pb-24">

<header class="sticky top-0 z-40 bg-[var(--world-navy)]/90 backdrop-blur-lg border-b border-[var(--world-gold)]/20 px-6 py-5">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-[var(--world-gold)] rounded-xl flex items-center justify-center shadow-lg">
            <i class='fas fa-trophy text-black text-lg'></i>
        </div>
        <h1 class="heading-font text-lg leading-none italic">Master League <span class="text-[var(--world-gold)]">| World Cup</span></h1>
    </div>
</header>

<main class="p-5 max-w-4xl mx-auto">
    <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-8">
        <button onclick="setRound(1)" id="round-1" class="round-btn flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-[var(--world-gold)] text-black">Round 1</button>
        <button onclick="setRound(2)" id="round-2" class="round-btn flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-zinc-900 text-white">Round 2</button>
        <button onclick="setRound(3)" id="round-3" class="round-btn flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-zinc-900 text-white">Round 3</button>
    </div>
    <div class="space-y-12">
        <div>
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-4 px-2 italic">Match Fixtures</h2>
            <div id="fixture-container" class="space-y-4"></div>
        </div>
        <div>
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-4 px-2 italic">League Standings</h2>
            <div id="standings-container" class="space-y-8"></div>
        </div>
    </div>
</main>

<script>
    const TELEGRAM_LINKS = {
        "Algeria": "https://t.me/kenzjust",
        "Argentina": "https://t.me/agust_HML",
        "Australia": "https://t.me/KoKyaw_KYT",
        "Austria": "https://t.me/Khine_Lin_Htay",
        "Belgium": "https://t.me/Garniya",
        "Bosnia and Herzegovina": "https://t.me/MinThwe18",
        "Brazil": "https://t.me/Doraemoncat77",
        "Canada": "https://t.me/zam57493",
        "Cape Verde": "https://t.me/yminchit69",
        "Colombia": "https://t.me/",
        "Croatia": "https://t.me/EiXiao7",
        "Curaçao": "https://t.me/Badrul11",
        "Czechia": "https://t.me/Ranger13102003",
        "DR Congo": "https://t.me/zeusace0",
        "Ecuador": "https://t.me/Wallker29",
        "Egypt": "https://t.me/Phir_tayin",
        "England": "https://t.me/",
        "France": "https://t.me/MRTONE3",
        "Germany": "https://t.me/Crikxnt7",
        "Ghana": "https://t.me/Kyawthaik468",
        "Haiti": "https://t.me/Dijeaan",
        "Iran": "https://t.me/heinkyawthuang",
        "Iraq": "https://t.me/Theinau",
        "Japan": "https://t.me/Aungpyinnyar",
        "Jordan": "https://t.me/BlackEaglessuper",
        "Mexico": "https://t.me/Nyishein77",
        "Morocco": "https://t.me/shineshine013",
        "Netherlands": "https://t.me/Khualpu199",
        "New Zealand": "https://t.me/jthu23",
        "Norway": "https://t.me/Orodevice",
        "Panama": "https://t.me/Youpop556",
        "Paraguay": "https://t.me/ventus2940",
        "Portugal": "https://t.me/MUCHExt",
        "Qatar": "https://t.me/GwaytolayZLT",
        "Saudi Arabia": "https://t.me/MCngakaung",
        "Scotland": "https://t.me/ceeyg",
        "Senegal": "https://t.me/Ricechat13579",
        "South Africa": "https://t.me/paingqt",
        "South Korea": "https://t.me/MayJu2004",
        "Spain": "https://t.me/Hein040",
        "Sweden": "https://t.me/luhan123456",
        "Switzerland": "https://t.me/oki6k",
        "Tunisia": "#",
        "Türkiye": "https://t.me/an_Idiot1",
        "United States": "https://t.me/kyawlwintun17",
        "Uruguay": "https://t.me/everton55555",
        "Uzbekistan": "https://t.me/lord_voldemort101",
        "Côte d'Ivoire": "https://t.me/mrleon006"
    };

    const PLAYER_NAMES = ["Argentina", "Australia", "Austria", "Belgium", "Bosnia and Herzegovina", "Brazil", "Canada", "Cape Verde", "Colombia", "Croatia", "Curaçao", "Czechia", "DR Congo", "Ecuador", "Egypt", "England", "France", "Germany", "Ghana", "Haiti", "Iran", "Iraq", "Japan", "Jordan", "Mexico", "Morocco", "Netherlands", "New Zealand", "Norway", "Panama", "Paraguay", "Portugal", "Qatar", "Saudi Arabia", "Scotland", "Senegal", "South Africa", "South Korea", "Spain", "Sweden", "Switzerland", "Tunisia", "Türkiye", "United States", "Uruguay", "Uzbekistan", "Algeria", "Côte d'Ivoire"];
    
    const G_NAMES = "ABCDEFGHIJKL".split("");
    let state = { teams: [], matches: [], activeRound: 1 };

    function initLeague() {
        state.teams = PLAYER_NAMES.map((name, i) => {
            const groupIndex = Math.floor(i / 4);
            return { id: i + 1, name: name, group: G_NAMES[groupIndex] || "Z", link: TELEGRAM_LINKS[name] || "#", m: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
        });
        state.matches = [];
        let mid = 1;
        G_NAMES.forEach(g => {
            const gt = state.teams.filter(t => t.group === g);
            const pairings = [{h:0, a:1, r:1}, {h:2, a:3, r:1}, {h:0, a:2, r:2}, {h:1, a:3, r:2}, {h:0, a:3, r:3}, {h:1, a:2, r:3}];
            pairings.forEach(p => { state.matches.push({ id: mid++, group: g, round: p.r, home: gt[p.h].name, away: gt[p.a].name, hS: null, aS: null }); });
        });
        
        updateStandings();
        render();
    }

    function getScoreColor(s1, s2) {
        if (s1 === null || s2 === null) return "";
        if (s1 === s2) return "text-yellow-400";
        return s1 > s2 ? "text-green-500" : "text-red-500";
    }

    function editMatch(id) {
        const match = state.matches.find(m => m.id === id);
        const score = prompt(`Enter score for ${match.home} vs ${match.away} (e.g. 2-1):`);
        if (score && score.includes('-')) {
            const [hS, aS] = score.split('-').map(Number);
            match.hS = hS; match.aS = aS; updateStandings(); render();
        }
    }

    function updateStandings() {
        state.teams.forEach(t => { t.m=t.w=t.d=t.l=t.gf=t.ga=t.gd=t.pts = 0; });
        state.matches.forEach(m => {
            if (m.hS !== null && m.aS !== null) {
                const home = state.teams.find(t => t.name === m.home);
                const away = state.teams.find(t => t.name === m.away);
                home.m++; away.m++;
                home.gf += m.hS; home.ga += m.aS; away.gf += m.aS; away.ga += m.hS;
                if(m.hS > m.aS) { home.w++; home.pts += 3; away.l++; }
                else if(m.hS < m.aS) { away.w++; away.pts += 3; home.l++; }
                else { home.d++; away.d++; home.pts += 1; away.pts += 1; }
                home.gd = home.gf - home.ga; away.gd = away.gf - away.ga;
            }
        });
    }

    function render() {
        const rdMatches = state.matches.filter(m => m.round === state.activeRound);
        let lastG = "";
        
        const fixtureContainer = document.getElementById('fixture-container');
        fixtureContainer.innerHTML = rdMatches.map(m => {
            let header = m.group !== lastG ? (lastG = m.group, `<div class="group-header py-2 px-4 mb-3 text-[10px] font-black text-[var(--world-gold)] uppercase italic">Group ${m.group}</div>`) : "";
            const home = state.teams.find(t => t.name === m.home);
            const away = state.teams.find(t => t.name === m.away);
            const hColor = getScoreColor(m.hS, m.aS);
            const aColor = getScoreColor(m.aS, m.hS);
            return header + `<div class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-2">
                <div class="flex-1 text-right pr-4 text-[11px] font-bold truncate">
                   ${home.link && home.link !== "#" && home.link !== "https://t.me/" ? `<a href="${home.link}" target="_blank" class="team-link">${m.home}</a>` : m.home}
                </div>
                <div onclick="editMatch(${m.id})" class="flex items-center space-x-2 cursor-pointer">
                    <div class="score-box ${hColor}">${m.hS !== null ? m.hS : '-'}</div>
                    <div class="score-box ${aColor}">${m.aS !== null ? m.aS : '-'}</div>
                </div>
                <div class="flex-1 text-left pl-4 text-[11px] font-bold truncate">
                   ${away.link && away.link !== "#" && away.link !== "https://t.me/" ? `<a href="${away.link}" target="_blank" class="team-link">${m.away}</a>` : m.away}
                </div>
            </div>`;
        }).join('');

        fixtureContainer.classList.remove('fade-in');
        void fixtureContainer.offsetWidth; // trigger reflow
        fixtureContainer.classList.add('fade-in');

        document.getElementById('standings-container').innerHTML = G_NAMES.map(g => {
            const gt = state.teams.filter(t => t.group === g).sort((a,b) => b.pts - a.pts || b.gd - a.gd);
            return `<div class="bg-black/40 rounded-3xl p-5 border border-[var(--world-gold)]/10 overflow-x-auto">
                <div class="text-[10px] font-black text-[var(--world-gold)] mb-4">GROUP ${g}</div>
                <table class="w-full text-[10px] text-center min-w-[300px]">
                    <thead><tr class="text-zinc-500"><th class="text-left">TEAM</th><th>M</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead>
                    <tbody class="divide-y divide-white/5">${gt.map(t => `<tr class="h-14">
                        <td class="text-left py-2">
                            <div class="font-bold">${t.link && t.link !== "#" && t.link !== "https://t.me/" ? `<a href="${t.link}" target="_blank" class="team-link">${t.name}</a>` : t.name}</div>
                        </td>
                        <td>${t.m}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td>
                        <td class="font-bold text-[var(--world-gold)]">${t.pts}</td>
                    </tr>`).join('')}</tbody>
                </table>
            </div>`;
        }).join('');
    }

    window.setRound = (r) => { 
        state.activeRound = r; 
        document.querySelectorAll('.round-btn').forEach(btn => {
            btn.classList.remove('bg-[var(--world-gold)]', 'text-black');
            btn.classList.add('bg-zinc-900', 'text-white');
        });
        const activeBtn = document.getElementById('round-'+r);
        activeBtn.classList.remove('bg-zinc-900', 'text-white');
        activeBtn.classList.add('bg-[var(--world-gold)]', 'text-black');
        render(); 
    };

    window.onload = initLeague;
</script>
</body>
</html>
